<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hostel Expense Tracker</title>
    <base href="/hostel-expense-tracker" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Apply theme before paint to avoid light flash -->
    <script>
      (function () {
        try {
          var key = 'hostel-expense-tracker-theme';
          var pref = localStorage.getItem(key);
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (pref === 'light' || pref === 'dark' || pref === 'system') {
            document.documentElement.dataset.theme = pref;
          } else {
            document.documentElement.dataset.theme = 'system';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
