<div class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center">
  <div class="ui-card p-6 sm:p-8">
    <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-brand-700 dark:text-brand-400">
      {{ 'app.brand' | transloco }}
    </p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
      {{ 'login.title' | transloco }}
    </h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-zinc-400">{{ 'login.subtitle' | transloco }}</p>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block">
        <span class="mb-1.5 block text-sm font-semibold text-slate-700 dark:text-zinc-300">
          {{ 'login.username' | transloco }}
        </span>
        <input class="ui-input" type="text" autocomplete="username" formControlName="username" />
      </label>
      <label class="block">
        <span class="mb-1.5 block text-sm font-semibold text-slate-700 dark:text-zinc-300">
          {{ 'login.password' | transloco }}
        </span>
        <input class="ui-input" type="password" autocomplete="current-password" formControlName="password" />
      </label>
      <button type="submit" class="ui-btn-primary w-full" [disabled]="submitting()">
        {{ (submitting() ? 'login.signingIn' : 'login.submit') | transloco }}
      </button>
    </form>
  </div>
</div>
