<div class="min-h-dvh text-slate-900 dark:text-zinc-100">
  <header
    class="sticky top-0 z-40 border-b border-white/60 bg-white/80 shadow-[0_1px_0_rgb(15_23_42_/_0.04)] backdrop-blur-xl dark:border-white/[0.06] dark:bg-black/90 dark:shadow-[0_1px_0_rgb(0_0_0_/_0.8)]"
  >
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
      <a
        routerLink="/"
        class="group flex min-w-0 items-center gap-3 rounded-2xl outline-offset-2 transition hover:opacity-90"
        [attr.aria-label]="'nav.homeAria' | transloco"
      >
        <div
          class="relative flex size-10 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-gradient-to-br from-brand-500 to-brand-800 text-sm font-extrabold tracking-tight text-white shadow-md shadow-brand-600/30 transition group-hover:shadow-lg group-hover:shadow-brand-600/35"
          aria-hidden="true"
        >
          <span class="relative z-10">HE</span>
          <span
            class="absolute -end-1 -top-1 size-6 rounded-full bg-white/20 blur-[2px]"
            aria-hidden="true"
          ></span>
        </div>
        <div class="min-w-0">
          <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-brand-700 dark:text-brand-400">
            {{ 'app.brand' | transloco }}
          </p>
          <h1 class="truncate text-base font-bold tracking-tight text-slate-900 sm:text-lg dark:text-white">
            {{ 'app.title' | transloco }}
          </h1>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <!-- Desktop nav -->
        <nav
          class="hidden items-center gap-1 rounded-2xl border border-slate-200/80 bg-slate-50/80 p-1 md:flex dark:border-white/10 dark:bg-[#0a0c10]"
          [attr.aria-label]="'nav.mainAria' | transloco"
        >
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-white text-brand-800 shadow-sm ring-1 ring-slate-200/80 dark:bg-[#1a1e28] dark:text-brand-300 dark:ring-white/10"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-900 dark:text-zinc-500 dark:hover:text-zinc-100"
            >
              {{ item.labelKey | transloco }}
            </a>
          }
        </nav>

        <!-- How it works / user journey -->
        <button
          type="button"
          class="ui-icon-btn"
          [attr.aria-label]="'journey.openAria' | transloco"
          [attr.title]="'journey.openAria' | transloco"
          (click)="openJourney()"
        >
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"
            />
          </svg>
        </button>

        <!-- Theme toggle (cycles light → dark → system) -->
        <button
          type="button"
          class="ui-icon-btn"
          [attr.aria-label]="themeAriaKey() | transloco"
          [attr.title]="themeAriaKey() | transloco"
          (click)="cycleTheme()"
        >
          @if (theme.preference() === 'dark') {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
              />
            </svg>
          } @else if (theme.preference() === 'system') {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25A2.25 2.25 0 0 1 5.25 3h13.5A2.25 2.25 0 0 1 21 5.25Z"
              />
            </svg>
          } @else {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
              />
            </svg>
          }
        </button>

        <!-- Language toggle -->
        <button
          type="button"
          class="ui-icon-btn text-sm font-bold"
          [attr.aria-label]="'lang.aria' | transloco"
          (click)="switchLanguage()"
        >
          {{ language.lang() === 'ar' ? 'EN' : 'ع' }}
        </button>

        <!-- Mobile burger -->
        <button
          type="button"
          class="ui-icon-btn md:hidden"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="mobile-nav"
          [attr.aria-label]="'nav.toggleMenu' | transloco"
          (click)="toggleMenu()"
        >
          @if (menuOpen()) {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          } @else {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          }
        </button>
      </div>
    </div>

    @if (menuOpen()) {
      <div
        id="mobile-nav"
        class="border-t border-slate-100/80 bg-white/95 px-4 py-3 backdrop-blur-xl md:hidden sm:px-6 dark:border-white/[0.06] dark:bg-black/95"
      >
        <nav class="flex flex-col gap-1" [attr.aria-label]="'nav.mobileAria' | transloco">
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-brand-600 text-white shadow-sm shadow-brand-600/20 hover:!bg-brand-700 hover:!text-white"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900 dark:text-zinc-300 dark:hover:bg-white/5 dark:hover:text-white"
              (click)="closeMenu()"
            >
              {{ item.labelKey | transloco }}
            </a>
          }
          <button
            type="button"
            class="rounded-xl px-4 py-3 text-start text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900 dark:text-zinc-300 dark:hover:bg-white/5 dark:hover:text-white"
            (click)="openJourney()"
          >
            {{ 'journey.navLabel' | transloco }}
          </button>
        </nav>
      </div>
    }
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
    <router-outlet />
  </main>

  <app-user-journey />
  <app-toast-host />
</div>
