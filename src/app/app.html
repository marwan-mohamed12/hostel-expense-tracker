<div class="min-h-dvh bg-slate-100 text-slate-900">
  <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
      <div class="flex min-w-0 items-center gap-3">
        <div class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-teal-600 text-sm font-bold text-white shadow-sm">
          HE
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold uppercase tracking-wider text-teal-700">
            {{ 'app.brand' | transloco }}
          </p>
          <h1 class="truncate text-lg font-bold text-slate-900">
            {{ 'app.title' | transloco }}
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Desktop nav -->
        <nav class="hidden items-center gap-2 md:flex" [attr.aria-label]="'nav.mainAria' | transloco">
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-teal-600 text-white shadow-sm hover:!bg-teal-700 hover:!text-white"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
            >
              {{ item.labelKey | transloco }}
            </a>
          }
        </nav>

        <!-- Language toggle (end of navbar) -->
        <button
          type="button"
          class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50"
          [attr.aria-label]="'lang.aria' | transloco"
          (click)="switchLanguage()"
        >
          {{ language.lang() === 'ar' ? 'EN' : 'ع' }}
        </button>

        <!-- Mobile burger -->
        <button
          type="button"
          class="inline-flex size-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:bg-slate-50 md:hidden"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="mobile-nav"
          [attr.aria-label]="'nav.toggleMenu' | transloco"
          (click)="toggleMenu()"
        >
          @if (menuOpen()) {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          } @else {
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          }
        </button>
      </div>
    </div>

    @if (menuOpen()) {
      <div
        id="mobile-nav"
        class="border-t border-slate-100 bg-white px-4 py-3 shadow-sm md:hidden sm:px-6"
      >
        <nav class="flex flex-col gap-1" [attr.aria-label]="'nav.mobileAria' | transloco">
          @for (item of navItems; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-teal-600 text-white shadow-sm hover:!bg-teal-700 hover:!text-white"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="rounded-xl px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-900"
              (click)="closeMenu()"
            >
              {{ item.labelKey | transloco }}
            </a>
          }
        </nav>
      </div>
    }
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
    <router-outlet />
  </main>

  <lib-toastify-toast-container
    [position]="toastPosition()"
    transition="slide"
    [autoClose]="2800"
    [newestOnTop]="true"
    [preventDuplicates]="true"
    [hideProgressBar]="false"
    iconLibrary="none"
  />
</div>
