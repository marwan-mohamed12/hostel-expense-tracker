<div class="month-picker relative w-full">
  <button
    type="button"
    class="ui-input flex w-full items-center gap-2 text-start !py-2.5"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="'dialog'"
    [attr.aria-label]="ariaLabelKey() | transloco"
    (click)="toggle()"
  >
    <svg
      class="size-4 shrink-0 text-brand-700 dark:text-brand-400"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M5.75 2a.75.75 0 0 1 .75.75V4h7V2.75a.75.75 0 0 1 1.5 0V4h.25A2.75 2.75 0 0 1 18 6.75v8.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25v-8.5A2.75 2.75 0 0 1 4.75 4H5V2.75A.75.75 0 0 1 5.75 2Zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75Z"
        clip-rule="evenodd"
      />
    </svg>
    <span class="min-w-0 flex-1 truncate font-semibold text-slate-900 dark:text-white">
      {{ displayLabel() }}
    </span>
    <svg
      class="size-4 shrink-0 text-slate-400 transition dark:text-zinc-500"
      [class.rotate-180]="open()"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  @if (open()) {
    <!-- Backdrop -->
    <button
      type="button"
      class="fixed inset-0 z-40 cursor-default bg-transparent"
      [attr.aria-label]="'common.cancel' | transloco"
      (click)="close()"
    ></button>

    <div
      class="absolute start-0 top-full z-50 mt-2 w-full min-w-[17.5rem] overflow-hidden rounded-2xl border border-slate-200 bg-white p-3 shadow-xl dark:border-white/10 dark:bg-[#0a0c10]"
      role="dialog"
      [attr.aria-label]="'dashboard.calendarTitle' | transloco"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-3 flex items-center justify-between gap-2">
        <button
          type="button"
          (click)="shiftYear(-1)"
          class="flex size-8 items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 dark:text-zinc-300 dark:hover:bg-white/10"
          [attr.aria-label]="'dashboard.prevYear' | transloco"
        >
          <svg class="size-4 rtl:rotate-180" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
        <p class="text-sm font-bold tabular-nums text-slate-900 dark:text-white">
          {{ calendarYear() }}
        </p>
        <button
          type="button"
          (click)="shiftYear(1)"
          class="flex size-8 items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 dark:text-zinc-300 dark:hover:bg-white/10"
          [attr.aria-label]="'dashboard.nextYear' | transloco"
        >
          <svg class="size-4 rtl:rotate-180" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-3 gap-1.5">
        @for (cell of calendarMonths(); track cell.id) {
          <button
            type="button"
            (click)="toggleMonth(cell.month)"
            class="relative rounded-xl px-1 py-2.5 text-center text-xs font-semibold transition"
            [class]="
              cell.selected
                ? 'bg-brand-600 text-white shadow-sm shadow-brand-600/30'
                : cell.isCurrent
                  ? 'bg-brand-50 text-brand-800 ring-1 ring-inset ring-brand-200 hover:bg-brand-100 dark:bg-brand-950/50 dark:text-brand-200 dark:ring-brand-800'
                  : 'text-slate-700 hover:bg-slate-100 dark:text-zinc-300 dark:hover:bg-white/10'
            "
            [attr.aria-pressed]="cell.selected"
          >
            {{ cell.shortLabel }}
            @if (cell.hasActivity && !cell.selected) {
              <span
                class="absolute bottom-1 start-1/2 size-1.5 -translate-x-1/2 rounded-full bg-brand-500 dark:bg-brand-400"
                aria-hidden="true"
              ></span>
            }
            @if (cell.hasActivity && cell.selected) {
              <span
                class="absolute bottom-1 start-1/2 size-1.5 -translate-x-1/2 rounded-full bg-white"
                aria-hidden="true"
              ></span>
            }
          </button>
        }
      </div>

      @if (allowAll()) {
        <div class="mt-3 flex flex-wrap gap-1.5">
          <button
            type="button"
            (click)="clearSelection()"
            class="min-w-0 flex-1 rounded-xl border px-2 py-2 text-xs font-semibold transition"
            [class]="
              !hasSelection()
                ? 'border-brand-300 bg-brand-50 text-brand-800 dark:border-brand-700 dark:bg-brand-950/40 dark:text-brand-200'
                : 'border-slate-200 text-slate-700 hover:bg-slate-50 dark:border-white/10 dark:text-zinc-300 dark:hover:bg-white/[0.04]'
            "
            [attr.aria-pressed]="!hasSelection()"
          >
            {{ allLabelKey() | transloco }}
          </button>
          @if (hasSelection()) {
            <button
              type="button"
              (click)="clearSelection()"
              class="shrink-0 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:border-rose-200 hover:bg-rose-50 hover:text-rose-800 dark:border-white/10 dark:bg-[#12151c] dark:text-zinc-300 dark:hover:border-rose-900/50 dark:hover:bg-rose-950/40 dark:hover:text-rose-200"
            >
              {{ 'expenses.clearMonthSelection' | transloco }}
            </button>
          }
        </div>
      }

      @if (activityMonthIds().length > 0) {
        <p class="mt-2.5 flex items-center justify-center gap-1.5 text-[10px] text-slate-500 dark:text-zinc-500">
          <span class="size-1.5 rounded-full bg-brand-500 dark:bg-brand-400" aria-hidden="true"></span>
          {{ 'expenses.monthHasActivity' | transloco }}
        </p>
      }
    </div>
  }
</div>
